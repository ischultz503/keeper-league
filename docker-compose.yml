# The whole production stack: one app container, one proxy. No load balancer,
# no database server, no cache -- ten managers and a spreadsheet's worth of data
# (see CLAUDE.md, deployment decisions).
#
# Compose puts both services on a private network and registers each service
# NAME as a hostname on it. That is why the Caddyfile says `reverse_proxy
# web:8000` and it simply works: "web" resolves to this container's address on
# that network. Nothing else on the internet can reach it, because only caddy
# publishes ports to the host.
#
# (No `version:` key -- it has been obsolete since Compose v2 and current
# versions warn about it.)

services:
  web:
    build: .
    restart: unless-stopped

    # DJANGO_SECRET_KEY, DJANGO_ALLOWED_HOSTS, DJANGO_CSRF_TRUSTED_ORIGINS,
    # DOMAIN and the FantasyPros key all come from the .env file sitting next to
    # this one on the server. It is never in the image (.dockerignore) and never
    # in git (.gitignore) -- it exists only on the box.
    env_file: .env

    environment:
      # Set here rather than in .env because they are facts about the
      # container's own layout, not deployment configuration someone edits.
      DJANGO_DB_PATH: /data/db.sqlite3
      DJANGO_STATIC_MANIFEST: "1"

    volumes:
      # The database lives on the HOST, in ./db, and is mounted at /data.
      #
      # This is the single most important line in the file. An image is
      # immutable and a container is disposable: anything written inside one is
      # gone the moment it is replaced, and replacing it is exactly what a
      # deploy does. Keeping db.sqlite3 out here means `docker compose up
      # --build` ships new code over the same, untouched league data.
      #
      # SQLite writes -wal and -journal files NEXT TO the database, so the
      # directory has to be writable, not just the file -- which is why the
      # mount is a directory and the app runs as UID 1000 (see Dockerfile).
      - ./db:/data

    # `expose` documents the port for other containers; it publishes nothing to
    # the host. gunicorn speaks plain HTTP and must only ever be reachable
    # through caddy, which is what terminates TLS.
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped

    # The only service with published ports. 80 is not optional even though the
    # site is HTTPS-only: Let's Encrypt validates the domain over port 80, and
    # Caddy uses it to redirect http -> https.
    ports:
      - "80:80"
      - "443:443"

    env_file: .env

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

      # Certificates and ACME account keys live in named volumes so they survive
      # `docker compose down` and every rebuild. This matters more than it
      # looks: Let's Encrypt rate-limits certificate issuance per domain per
      # week, and a stack that re-requests a certificate on every restart will
      # cheerfully lock itself out of HTTPS for days.
      - caddy_data:/data
      - caddy_config:/config

    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config:
